<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Afri Tech Hub - Empowering African entrepreneurs by sharing vacancies, jobs, grants, scholarships, internships, and business funding opportunities with no login or registration."
    />
    <meta
      name="keywords"
      content="African tech, entrepreneurship opportunities, African grants, scholarships for Africans, jobs in Africa, tech vacancies Africa, African startups funding, internships Africa"
    />
    <meta name="author" content="Afri Tech Hub" />
    <meta
      property="og:title"
      content="Afri Tech Hub - African Opportunities Portal"
    />
    <meta
      property="og:description"
      content="Find verified jobs, grants, scholarships, and funding opportunities across Africa. Access is completely open and free."
    />
    <meta property="og:type" content="website" />
    <title>Afri Tech Hub | Empowering African Entrepreneurs & Youth</title>

    <!-- Website Favicon / Browser Tab Icon -->
    <link rel="icon" type="image/jpeg" href="assets/images/logos/logo.jpg" />

    <!-- FontAwesome for modern icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a href="#app-content" class="skip-link">Skip to content</a>

    <!-- Unified Workspace Dashboard Wrapper -->
    <div class="workspace-wrapper">
      
      <!-- Left Sidebar navigation menu -->
      <aside class="workspace-sidebar" id="workspace-sidebar" aria-label="Sidebar Menu">
        <div class="sidebar-brand-container">
          <a href="#home" class="sidebar-brand">
            <img
              src="assets/images/logos/logo.jpg"
              alt="Afri Tech Hub Logo"
              class="brand-logo-img"
              width="36"
              height="36"
            />
            <div class="brand-text-container">
              <span class="brand-name">AfriTech Hub</span>
              <span class="brand-tagline">Opportunities Hub</span>
            </div>
          </a>
          <!-- Close button on Mobile sidebar drawer -->
          <button id="sidebar-close-btn" class="icon-btn sidebar-close-btn" aria-label="Close Sidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <!-- Navigation Menu -->
        <nav class="sidebar-nav" role="navigation" aria-label="Main Navigation">
          <a href="#home" class="sidebar-link active" data-route="home">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
          </a>
          <a href="#opportunities" class="sidebar-link" data-route="opportunities">
            <i class="fa-solid fa-briefcase"></i> <span>Opportunities</span>
          </a>
          <a href="#categories" class="sidebar-link" data-route="categories">
            <i class="fa-solid fa-tags"></i> <span>Categories</span>
          </a>
          <a href="#faq" class="sidebar-link" data-route="faq">
            <i class="fa-solid fa-circle-question"></i> <span>FAQs</span>
          </a>
          <a href="#about" class="sidebar-link" data-route="about">
            <i class="fa-solid fa-circle-info"></i> <span>About Us</span>
          </a>
          <a href="#contact" class="sidebar-link" data-route="contact">
            <i class="fa-solid fa-envelope"></i> <span>Contact</span>
          </a>
        </nav>

        <!-- Sidebar footer area -->
        <div class="sidebar-footer">
          <button
            id="theme-toggle"
            class="icon-btn sidebar-theme-btn"
            title="Toggle Dark/Light Mode"
            aria-label="Toggle Theme"
          >
            <i class="fa-solid fa-moon" id="theme-icon"></i>
          </button>
          <a
            href="https://chat.whatsapp.com/Bd2MI5seG7y8HoJjbfpQrH"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-sm btn-whatsapp sidebar-whatsapp-btn"
          >
            <i class="fa-brands fa-whatsapp"></i> <span>Join Hub</span>
          </a>
        </div>
      </aside>

      <!-- Sidebar Backdrop drawer overlay on Mobile -->
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

      <!-- Main workspace canvas -->
      <div class="workspace-main">
        <!-- Sticky Workspace Header -->
        <header class="workspace-header" role="banner">
          <div class="header-inner">
            <div class="header-left">
              <button
                id="menu-toggle"
                class="menu-toggle icon-btn"
                title="Toggle Navigation Menu"
                aria-label="Toggle Navigation"
                aria-controls="workspace-sidebar"
                aria-expanded="false"
              >
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
              </button>
              <h1 id="view-title" class="view-title">Dashboard Overview</h1>
            </div>
            
            <div class="header-right">
              <span class="live-indicator"><span class="pulse-dot"></span> Live Directory</span>
            </div>
          </div>
          <!-- Scroll Progress indicator -->
          <div class="scroll-progress-container">
            <div id="scroll-progress-bar" class="scroll-progress-bar"></div>
          </div>
        </header>

        <!-- SPA dynamic content panel -->
        <main id="app-content" class="workspace-content" role="main" tabindex="-1">
          <!-- Views will be injected here dynamically -->
        </main>

        <!-- Compact Workspace footer -->
        <footer class="workspace-footer">
          <div class="footer-inner">
            <p class="copyright-text">&copy; 2026 AfriTech Hub. Open access directory.</p>
            <div class="footer-links-row">
              <a href="#privacy" class="footer-bottom-link">Privacy Policy</a>
              <span class="divider">•</span>
              <a href="#terms" class="footer-bottom-link">Terms of Use</a>
              <span class="divider">•</span>
              <a href="#admin-login" class="footer-bottom-link"><i class="fa-solid fa-lock"></i> Admin Portal</a>
            </div>
          </div>
        </footer>
      </div>
    </div>

    <!-- Floating actions (collapsible WhatsApp community trigger only) -->
    <div class="floating-actions-container">
      <a
        href="https://chat.whatsapp.com/Bd2MI5seG7y8HoJjbfpQrH"
        target="_blank"
        rel="noopener noreferrer"
        class="floating-btn floating-whatsapp"
        aria-label="Join WhatsApp Community"
      >
        <i class="fa-brands fa-whatsapp"></i>
        <span class="floating-tooltip">Join WhatsApp Group</span>
      </a>
    </div>

    <!-- Global Alert Toasts -->
    <div
      id="toast-alert"
      class="alert-popup success"
      role="status"
      aria-live="polite"
      aria-atomic="true"
      aria-hidden="true"
    >
      <i class="fa-solid fa-circle-check" aria-hidden="true"></i>
      <span id="toast-message">Operation successful!</span>
    </div>

    <!-- ==========================================
       DATA & CORE JAVASCRIPT FILES
       ========================================== -->
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
